<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 집 강아지 콩이 소개</title>
</head>
<body>
  <header>
    <h1>우리 집 강아지 콩이를 소개해요</h1>
  </header>

  <main>
    <section id="profile">
      <h2>프로필</h2>
      <table>
        <tbody>
          <tr><th>이름</th><td>콩이</td></tr>
          <tr><th>품종</th><td>말티즈</td></tr>
          <tr><th>나이</th><td>3살</td></tr>
          <tr><th>성별</th><td>여아</td></tr>
          <tr><th>몸무게</th><td>3.2kg</td></tr>
        </tbody>
      </table>
    </section>

    <section id="personality">
      <h2>성격</h2>
      <ul>
        <li>사람을 좋아함</li>
        <li>처음 보는 강아지는 무서워함</li>
      </ul>
    </section>

    <section id="likes">
      <h2>좋아하는 것</h2>
      <ul>
        <li>산책</li>
        <li>삑삑이 공</li>
        <li>고구마 간식</li>
      </ul>
    </section>

    <section id="routine">
      <h2>하루 일과</h2>
      <ol>
        <li>아침 7시 산책</li>
        <li>낮잠</li>
        <li>저녁 7시 산책</li>
        <li>밤 10시 잠</li>
      </ol>
    </section>

    <section id="caution">
      <h2>만날 때 주의</h2>
      <ul>
        <li>갑자기 안아 올리지 않기</li>
        <li>사람 음식 주지 않기</li>
      </ul>
    </section>

    <section id="photos">
      <h2>사진</h2>
      <div class="photos">
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
      </div>
    </section>
  </main>

  <!-- 모달 틀: 2단계에서 숨기고, 사진을 누르면 열리게 연결 -->
  <div id="modal">
    <div class="modal-photo"></div>
    <button type="button" id="close-btn">닫기</button>
  </div>
</body>
</html>
