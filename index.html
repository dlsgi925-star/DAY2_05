<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 집 강아지 콩이 소개</title>
  <style>
    :root {
      --bg: #fff7fb;
      --card: #ffffff;
      --text: #4a4458;
      --muted: #8d869b;
      --pink: #ffd6e7;
      --mint: #d5f3e6;
      --sky: #d6e8ff;
      --lemon: #fff3c4;
      --lavender: #e6dcff;
      --accent: #c46fa0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      word-break: keep-all;
    }
    header {
      padding: 36px 16px 24px;
      text-align: center;
      background: linear-gradient(180deg, var(--pink), var(--bg));
    }
    header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
    main { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }

    /* 둥근 카드 */
    section {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(150, 120, 170, .12);
    }
    h2 {
      display: inline-block;
      margin: 0 0 14px;
      padding: 2px 16px;
      border-radius: 999px;
      font-size: 1rem;
      background: var(--pink);
    }
    #profile h2 { background: var(--pink); }
    #personality h2 { background: var(--mint); }
    #likes h2 { background: var(--lemon); }
    #routine h2 { background: var(--sky); }
    #caution h2 { background: var(--lavender); }
    #photos h2 { background: var(--pink); }

    /* 프로필 표 */
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    th, td { padding: 10px 14px; text-align: left; }
    th {
      width: 36%;
      background: var(--pink);
      border-radius: 14px 0 0 14px;
      font-weight: 700;
    }
    td { background: #fff0f6; border-radius: 0 14px 14px 0; }

    /* 목록 */
    section ul { list-style: none; margin: 0; padding: 0; }
    section ul li {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: #f6f3fb;
    }
    section ul li:last-child { margin-bottom: 0; }
    #personality li { background: #eefaf4; }
    #likes li { background: #fffaea; }
    #caution li { background: #f3eeff; }

    /* 하루 일과: 순서가 보이는 번호 카드 */
    #routine ol { list-style: none; counter-reset: step; margin: 0; padding: 0; }
    #routine li {
      counter-increment: step;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: #eef5ff;
    }
    #routine li:last-child { margin-bottom: 0; }
    #routine li::before {
      content: counter(step);
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--sky);
      text-align: center;
      line-height: 28px;
      font-weight: 700;
    }

    /* 사진: 회색 박스 6개 */
    .photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .photo {
      aspect-ratio: 1 / 1;
      background: #d9d9de;
      border-radius: 18px;
      cursor: pointer;
    }
    .photo:active { transform: scale(.97); }
    @media (min-width: 560px) {
      .photos { grid-template-columns: repeat(3, 1fr); }
    }

    /* 모달: 화면 가운데에 크게, 뒷배경 어둡게 */
    #modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      background: rgba(60, 50, 80, .6);
    }
    #modal[hidden] { display: none; }
    .modal-photo {
      width: min(100%, 480px);
      aspect-ratio: 1 / 1;
      max-height: 70vh;
      background: #d9d9de;
      border-radius: 24px;
    }
    #close-btn {
      min-width: 160px;
      min-height: 52px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: var(--pink);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>우리 집 강아지 콩이를 소개해요</h1>
  </header>

  <main>
    <section id="profile">
      <h2>프로필</h2>
      <table>
        <tbody>
          <tr><th>이름</th><td>콩이</td></tr>
          <tr><th>품종</th><td>말티즈</td></tr>
          <tr><th>나이</th><td>3살</td></tr>
          <tr><th>성별</th><td>여아</td></tr>
          <tr><th>몸무게</th><td>3.2kg</td></tr>
        </tbody>
      </table>
    </section>

    <section id="personality">
      <h2>성격</h2>
      <ul>
        <li>사람을 좋아함</li>
        <li>처음 보는 강아지는 무서워함</li>
      </ul>
    </section>

    <section id="likes">
      <h2>좋아하는 것</h2>
      <ul>
        <li>산책</li>
        <li>삑삑이 공</li>
        <li>고구마 간식</li>
      </ul>
    </section>

    <section id="routine">
      <h2>하루 일과</h2>
      <ol>
        <li>아침 7시 산책</li>
        <li>낮잠</li>
        <li>저녁 7시 산책</li>
        <li>밤 10시 잠</li>
      </ol>
    </section>

    <section id="caution">
      <h2>만날 때 주의</h2>
      <ul>
        <li>갑자기 안아 올리지 않기</li>
        <li>사람 음식 주지 않기</li>
      </ul>
    </section>

    <section id="photos">
      <h2>사진</h2>
      <div class="photos">
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
      </div>
    </section>
  </main>

  <!-- 사진 모달: 기본은 숨김, 사진을 누르면 열리고 [닫기]로 닫힘 -->
  <div id="modal" hidden>
    <div class="modal-photo"></div>
    <button type="button" id="close-btn">닫기</button>
  </div>

  <script>
    var modal = document.getElementById('modal');

    // 사진(회색 박스)을 누르면 모달 열기
    document.querySelectorAll('#photos .photo').forEach(function (photo) {
      photo.addEventListener('click', function () {
        modal.hidden = false;
      });
    });

    // [닫기] 버튼을 누르면 모달 닫기
    document.getElementById('close-btn').addEventListener('click', function () {
      modal.hidden = true;
    });
  </script>
</body>
</html>
